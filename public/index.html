<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing Form SPMB - SekolahMu</title>
    <!-- Tailwind CSS CDN untuk styling cepat & rapi -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 py-10 px-4">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-md">
        <div class="mb-6 border-b pb-4">
            <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">Branch: backend/suclyn2</span>
            <h1 class="text-2xl font-bold text-gray-800 mt-2">Formulir Puji Coba / Testing SPMB</h1>
            <p class="text-sm text-gray-500">Form ini digunakan untuk menguji penyimpanan data ke database melalui <code>PageController@prosesPendaftaran</code>.</p>
        </div>

        <!-- Form mengarah ke route backend Laravel -->
        <form action="/proses-pendaftaran" method="POST" enctype="multipart/form-data" class="space-y-6">
            <!-- @csrf -->
            <!-- 
                Catatan: Karena ini file .html murni di folder public, token CSRF Laravel 
                biasanya butuh Blade (.blade.php). Jika nanti diakses via route Laravel, 
                pastikan endpoint menerima POST atau ubah ekstensi jadi .blade.php jika diperlukan. 
            -->
            
            <!-- Data Pribadi -->
            <div>
                <h3 class="text-lg font-semibold text-gray-700 mb-3">1. Data Pribadi Calon Siswa</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nama Lengkap</label>
                        <input type="text" name="nama_lengkap" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Contoh: Budi Santoso">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Jenis Kelamin</label>
                        <select name="gender" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="laki-laki">Laki-laki</option>
                            <option value="perempuan">Perempuan</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Tempat Lahir</label>
                        <input type="text" name="tempat_lahir" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="Kota Lahir">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Tanggal Lahir</label>
                        <input type="date" name="tanggal_lahir" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">NISN (10 Digit)</label>
                        <input type="text" name="nisn" maxlength="10" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="0081234567">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">NIK (16 Digit)</label>
                        <input type="text" name="nik" maxlength="16" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="1207xxxxxxxxxxxx">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Agama</label>
                        <input type="text" name="agama" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" value="Islam">
                    </div>
                </div>
            </div>

            <!-- Data Kontak & Alamat -->
            <div>
                <h3 class="text-lg font-semibold text-gray-700 mb-3">2. Kontak & Alamat</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" name="email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="email@domain.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">No. Telepon / WhatsApp</label>
                        <input type="text" name="telepon" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="081234567890">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700">Alamat Lengkap</label>
                        <textarea name="alamat" rows="2" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="Jalan, RT/RW, Kelurahan, Kecamatan"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Kota / Kabupaten</label>
                        <input type="text" name="kota" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" value="Binjai">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Provinsi</label>
                        <input type="text" name="provinsi" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" value="Sumatera Utara">
                    </div>
                </div>
            </div>

            <!-- Data Orang Tua -->
            <div>
                <h3 class="text-lg font-semibold text-gray-700 mb-3">3. Data Orang Tua / Wali</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nama Ayah</label>
                        <input type="text" name="nama_ayah" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Pekerjaan Ayah</label>
                        <input type="text" name="pekerjaan_ayah" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nama Ibu</label>
                        <input type="text" name="nama_ibu" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Pekerjaan Ibu</label>
                        <input type="text" name="pekerjaan_ibu" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700">No. Telepon Orang Tua</label>
                        <input type="text" name="telepon_ortu" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                </div>
            </div>

            <!-- Data Pendidikan & Jalur -->
            <div>
                <h3 class="text-lg font-semibold text-gray-700 mb-3">4. Asal Sekolah & Pilihan</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Asal Sekolah</label>
                        <input type="text" name="asal_sekolah" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="SMP Negeri 1 Binjai">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nilai Rata-rata Rapor</label>
                        <input type="number" step="0.01" name="nilai_rata" min="0" max="100" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="85.50">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Tahun Lulus</label>
                        <input type="number" name="tahun_lulus" min="2020" max="2026" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" value="2026">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Pilihan Program / Jurusan</label>
                        <select name="program" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="ipa">IPA</option>
                            <option value="ips">IPS</option>
                            <option value="bahasa">Bahasa</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700">Jalur Pendaftaran</label>
                        <select name="jalur_pendaftaran" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="Zonasi">Zonasi</option>
                            <option value="Afirmasi">Afirmasi</option>
                            <option value="Prestasi">Prestasi</option>
                            <option value="Perpindahan Tugas">Perpindahan Tugas</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Tombol Aksi -->
            <div class="pt-4 border-t flex justify-end">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-lg shadow transition">
                    Kirim Pendaftaran (Test DB)
                </button>
            </div>
        </form>
    </div>
</body>
</html>
